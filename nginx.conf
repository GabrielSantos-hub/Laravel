# Template de configuração do Nginx para o GUEASS em produção (Render).
#
# Este arquivo é um TEMPLATE: o placeholder ${PORT} é substituído pelo
# start.sh (via `envsubst`) pela porta real que o Render define em
# tempo de execução. O arquivo gerado fica em /tmp/nginx.conf para o
# processo conseguir gravar sem ser root.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    client_max_body_size 20M;

    # Diretórios temporários do Nginx em /tmp: o container roda como
    # www-data e não deve escrever em /var/lib/nginx.
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    access_log /dev/stdout;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name _;

        root  /var/www/html/public;
        index index.php;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Bloqueia arquivos ocultos (.env, .git, .htaccess, etc.).
        # Exceção: /.well-known/ (ACME / padrões IETF).
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
