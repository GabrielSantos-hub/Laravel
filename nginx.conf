# Template de configuração do Nginx para o GUEASS em produção (Render).
#
# Este arquivo é um TEMPLATE: o placeholder ${PORT} é substituído pelo
# start.sh (via `envsubst`) pela porta real que o Render define em
# tempo de execução, gerando /etc/nginx/nginx.conf antes do Nginx iniciar.
# O Nginx não lê variáveis de ambiente diretamente, por isso essa etapa
# de substituição é necessária.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    client_max_body_size 20M;

    # Diretórios temporários do Nginx redirecionados para /tmp: o
    # container roda como usuário não-root (www-data) e /tmp é
    # gravável por qualquer usuário, evitando erros de permissão.
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    access_log /dev/stdout;

    server {
        # ${PORT} vira o valor real (fornecido pelo Render) quando o
        # start.sh processa este template com envsubst.
        listen ${PORT};
        listen [::]:${PORT};
        server_name _;

        root  /var/www/html/public;
        index index.php;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Roteamento padrão do Laravel: tenta o arquivo/diretório real
        # e, se não existir, encaminha tudo para o front controller.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Qualquer requisição a um .php é enviada ao PHP-FPM (que escuta
        # na porta 9000 do próprio container, configuração padrão da
        # imagem php:8.2-fpm-alpine — não foi alterada).
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Bloqueia acesso direto a arquivos ocultos (.env, .git, etc.),
        # exceto o diretório .well-known (usado por validações ACME).
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
